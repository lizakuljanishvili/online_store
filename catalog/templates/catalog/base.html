
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Store</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        header {
            background-color: #222;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            color: white;
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #ff6868;
        }

        .container {
            width: 85%;
            max-width: 1200px;
            margin: 40px auto;
        }

        h1 {
            margin-bottom: 25px;
        }

        .content {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 30px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .product-card h3 {
            margin-top: 0;
        }

        .product-card a {
            color: #333;
            text-decoration: none;
        }

        .price {
            font-weight: bold;
            font-size: 18px;
        }

        .sale {
            color: white;
            background-color: #e63946;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }

        .sidebar {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            height: fit-content;
        }

        .sidebar a {
            display: block;
            color: #333;
            text-decoration: none;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .sidebar a:hover {
            color: #e63946;
        }

        .button {
            display: inline-block;
            background-color: #222;
            color: white;
            padding: 10px 18px;
            border-radius: 5px;
            text-decoration: none;
            margin-top: 10px;
        }

        .button:hover {
            background-color: #e63946;
        }

        footer {
            text-align: center;
            padding: 25px;
            margin-top: 50px;
            background-color: #222;
            color: white;
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 8px;
            }

            .content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>Online Store</h2>

        
<nav>
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'sale_products' %}">SALE</a>

    {% if user.is_authenticated %}

        <span style="color: white;">
            Hello, {{ user.username }}
        </span>

        <form method="POST" action="{% url 'logout' %}"
              style="display: inline;">

            {% csrf_token %}

            <button type="submit" class="button">
                Logout
            </button>

        </form>

    {% else %}

        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'register' %}">Register</a>

    {% endif %}

    <a href="/admin/">Admin</a>
</nav>

    </header>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        <p>Online Store &copy; 2026</p>
    </footer>

</body>
</html>
