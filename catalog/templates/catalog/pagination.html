{% if is_paginated %}

<div class="pagination">

    {% if page_obj.has_previous %}

        <a href="?q={{ request.GET.q|urlencode }}&category={{ request.GET.category|urlencode }}&sale={{ request.GET.sale|urlencode }}&min_price={{ request.GET.min_price|urlencode }}&max_price={{ request.GET.max_price|urlencode }}&sort={{ request.GET.sort|urlencode }}&page=1">
            First
        </a>

        <a href="?q={{ request.GET.q|urlencode }}&category={{ request.GET.category|urlencode }}&sale={{ request.GET.sale|urlencode }}&min_price={{ request.GET.min_price|urlencode }}&max_price={{ request.GET.max_price|urlencode }}&sort={{ request.GET.sort|urlencode }}&page={{ page_obj.previous_page_number }}">
            Previous
        </a>

    {% endif %}

    <span>
        Page {{ page_obj.number }}
        of {{ page_obj.paginator.num_pages }}
    </span>

    {% if page_obj.has_next %}

        <a href="?q={{ request.GET.q|urlencode }}&category={{ request.GET.category|urlencode }}&sale={{ request.GET.sale|urlencode }}&min_price={{ request.GET.min_price|urlencode }}&max_price={{ request.GET.max_price|urlencode }}&sort={{ request.GET.sort|urlencode }}&page={{ page_obj.next_page_number }}">
            Next
        </a>

        <a href="?q={{ request.GET.q|urlencode }}&category={{ request.GET.category|urlencode }}&sale={{ request.GET.sale|urlencode }}&min_price={{ request.GET.min_price|urlencode }}&max_price={{ request.GET.max_price|urlencode }}&sort={{ request.GET.sort|urlencode }}&page={{ page_obj.paginator.num_pages }}">
            Last
        </a>

    {% endif %}

</div>

{% endif %}
